# Nixpacks configuration for Coolify deployment
# This ensures Next.js always runs in PRODUCTION mode (next start, not next dev)

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["node --max-old-space-size=2048 node_modules/next/dist/bin/next build --webpack"]

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"
